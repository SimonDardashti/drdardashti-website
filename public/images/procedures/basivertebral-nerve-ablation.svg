<text x="50" y="235" fill="#222" font-family="Arial,sans-serif" font-size="24" font-weight="700">endplate</text>

<path d="M525 322 L438 322 L388 322" fill="none" stroke="#333" stroke-width="3"/>
<text x="50" y="310" fill="#222" font-family="Arial,sans-serif" font-size="24" font-weight="700">Basivertebral</text>
<text x="50" y="340" fill="#222" font-family="Arial,sans-serif" font-size="24" font-weight="700">nerve (BVN)</text>

