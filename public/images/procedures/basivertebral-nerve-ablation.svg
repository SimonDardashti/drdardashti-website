<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Conceptual basivertebral nerve pain target</title>
<desc id="desc">A conceptual cutaway of a lumbar vertebral body between two discs. The basivertebral nerve runs within the bone and branches toward the upper and lower endplates. A highlighted region marks the conceptual nerve target. This schematic explains the pain target, not procedural access, and is not to scale.</desc>
<defs>
  <linearGradient id="bone" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4e9d6"/><stop offset="1" stop-color="#dec9a8"/></linearGradient>
  <linearGradient id="disc" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a8c4cb"/><stop offset="1" stop-color="#6d929d"/></linearGradient>
</defs>
<rect width="1120" height="620" fill="#fbfaf7"/>
<text x="48" y="56" fill="#222" font-family="Arial,sans-serif" font-size="30" font-weight="700">Where BVNA targets</text>
<text x="48" y="91" fill="#555" font-family="Arial,sans-serif" font-size="21">Conceptual vertebral-body cutaway · not to scale</text>

